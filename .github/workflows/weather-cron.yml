name: Daily Weather Cache Cron Sync

on:
  schedule:
    # 00:00 UTC = 06:00 AM Bangladesh Standard Time (BST, UTC+6) daily
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FarmScale Daily Weather Sync API
        run: |
          curl -s -X POST "https://farmscale-web.vercel.app/api/cron/weather-sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "User-Agent: GitHub-Actions-Cron"
